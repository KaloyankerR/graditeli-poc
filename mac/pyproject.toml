[project]
name = "metro-beacon-mac"
version = "0.1.0"
description = "Mac prototype: BLE beacon zones read aloud in Bulgarian"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["."]
